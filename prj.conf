CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_ORESAT_COMMON_LIB=y
CONFIG_APPLICATION_INIT_PRIORITY=91
CONFIG_BUILD_OUTPUT_HEX=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_HWINFO=y
CONFIG_RTIO=y
CONFIG_RTIO_SYS_MEM_BLOCKS=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
# the following does not work with Zephyr 4.4.1 and RTIO; function missing in i2c_mcux_lpi2c_rtio.c
CONFIG_I2C_MCUX_LPI2C_BUS_RECOVERY=y

CONFIG_CAN_INTF=n
#CONFIG_CANOPENNODE_SYNC_THREAD=n
#CONFIG_CANOPENNODE_SDO_BUFFER_SIZE=889
#CONFIG_CAN_DEFAULT_BITRATE=1000000

# enable boot loader
CONFIG_MCUBOOT_ALLOWED=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BUFFER_SIZE=20480
CONFIG_LOG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_CANOPEN_LOG_LEVEL_ERR=y
#CONFIG_CAN_LOG_LEVEL_ERR=y

CONFIG_ASSERT=y

CONFIG_DEVICE_DT_METADATA=y
CONFIG_REBOOT=y
CONFIG_FAULT_DUMP=1

# changes for settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# enable/disable app components
CONFIG_MAG=n
CONFIG_IMU=y
CONFIG_MAGNETORQUERS=n
CONFIG_BLINK=y

# enforce can ID cannot be default (use shell)
CONFIG_CAN_ID_MUST_BE_SET=n

CONFIG_SENSOR_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_DEFERRED=n
#CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG=y
CONFIG_FAULT_DUMP=1
CONFIG_ASSERT=n
CONFIG_REBOOT=n
CONFIG_ENTROPY_GENERATOR=y

